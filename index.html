<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overtime Signup</title>

<style>
  body {
    font-family: system-ui, -apple-system, sans-serif;
    max-width: 520px;
    margin: 0 auto;
    padding: 24px;
    line-height: 1.4;
  }

  h1 {
    font-size: 1.5rem;
    margin-bottom: 24px;
  }

  h2 {
    font-size: 1.1rem;
    margin-top: 24px;
  }

  .name-field {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    font: inherit;
    border: 1px solid #aaa;
    border-radius: 8px;
    margin-top: 6px;
  }

  label {
    display: block;
    padding: 10px 0;
    font-size: 1.1rem;
  }

  input[type="checkbox"] {
    width: 22px;
    height: 22px;
    vertical-align: middle;
    margin-right: 10px;
  }

  textarea {
    width: 100%;
    box-sizing: border-box;
    min-height: 120px;
    padding: 12px;
    font: inherit;
    border: 1px solid #aaa;
    border-radius: 8px;
  }

  button {
    width: 100%;
    margin-top: 18px;
    padding: 14px;
    border: 0;
    border-radius: 8px;
    font-size: 1.05rem;
    cursor: pointer;
  }

  .required {
    color: #b00020;
  }

  .note {
    font-size: .9rem;
    opacity: .75;
    margin-top: 18px;
  }
</style>
</head>

<body>

<h1>Overtime Signup</h1>

<form id="form">

  <h2>Your Name <span class="required">*</span></h2>

  <input
    type="text"
    id="name"
    class="name-field"
    placeholder="Enter your name"
    required
  >

  <h2>Select the days you are available</h2>

  <label>
    <input type="checkbox" name="day" value="Monday">
    Monday
  </label>

  <label>
    <input type="checkbox" name="day" value="Tuesday">
    Tuesday
  </label>

  <label>
    <input type="checkbox" name="day" value="Wednesday">
    Wednesday
  </label>

  <label>
    <input type="checkbox" name="day" value="Thursday">
    Thursday
  </label>

  <label>
    <input type="checkbox" name="day" value="Friday">
    Friday
  </label>

  <label>
    <input type="checkbox" name="day" value="Saturday">
    Saturday
  </label>

  <h2>Additional Text</h2>

  <textarea
    id="additional"
    placeholder="Add any additional information..."
  ></textarea>

  <button type="submit">
    Submit
  </button>

</form>

<p class="note">
  Your messaging app will open with your information filled in.
  Review it and tap Send.
</p>

<script>

document.getElementById("form").addEventListener("submit", function(e) {

  e.preventDefault();

  const name = document.getElementById("name").value.trim();

  const days = [
    ...document.querySelectorAll('input[name="day"]:checked')
  ].map(x => x.value);

  const additional =
    document.getElementById("additional").value.trim();

  if (!name) {
    alert("Please enter your name.");
    return;
  }

  if (!days.length && !additional) {
    alert("Please select at least one day or enter additional text.");
    return;
  }

  let body = "OVERTIME SIGNUP\n\n";

  body += "Name: " + name + "\n";

  body += "Days: " +
    (days.length ? days.join(", ") : "None") +
    "\n";

  if (additional) {
    body += "\nAdditional text: " + additional;
  }

  const recipients = "19089378951,17329211425";

  window.location.href =
    "sms:" +
    recipients +
    "&body=" +
    encodeURIComponent(body);

});

</script>

</body>
</html>
